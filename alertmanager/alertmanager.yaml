global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url
  pagerduty_url: https://events.pagerduty.com/v2/enqueue

# Templates for rich Slack and PagerDuty messages
templates:
  - /etc/alertmanager/templates/*.tmpl

# ── Time intervals ────────────────────────────────────────────────────────────
# Used to gate ticket-class notifications to business hours (nobody actions a
# Slack digest at 3am — batching it avoids both noise and missed context) and
# to mute non-urgent channels on weekends. Paging routes are never gated.
time_intervals:
  - name: business-hours
    time_intervals:
      - weekdays: ["monday:friday"]
        times:
          - start_time: "09:00"
            end_time: "18:00"
        location: "America/Denver"

  - name: weekends
    time_intervals:
      - weekdays: ["saturday", "sunday"]
        location: "America/Denver"

route:
  # Default receiver for anything not matched below
  receiver: slack-default
  group_by: ["alertname", "namespace", "severity"]
  group_wait: 30s       # Wait before sending the first notification
  group_interval: 5m    # How long to wait before sending an updated notification
  repeat_interval: 4h   # How often to re-send ongoing alerts

  routes:
    # ── Critical: PagerDuty immediately ──────────────────────────────────────
    - matchers:
        - severity = "critical"
      receiver: pagerduty-critical
      group_wait: 10s
      repeat_interval: 1h
      # Also fan out to Slack for visibility
      continue: true

    # ── SLO fast burn: wake people up ────────────────────────────────────────
    - matchers:
        - alertname =~ "SLOFastBurn.*"
      receiver: pagerduty-slo
      group_wait: 0s      # No wait — fast burn needs immediate action
      repeat_interval: 30m
      continue: true

    # ── SLO slow burn: Slack channel notification ─────────────────────────────
    - matchers:
        - alertname =~ "SLOSlowBurn.*"
      receiver: slack-slo
      group_wait: 2m
      repeat_interval: 6h

    # ── Info / ticket-class alerts: business hours only ──────────────────────
    # Held by Alertmanager until the interval opens — nothing is dropped,
    # the notification just waits for someone who can act on it.
    - matchers:
        - severity = "info"
      receiver: slack-default
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h
      active_time_intervals:
        - business-hours

    # ── AI-enriched enrichment server webhook ─────────────────────────────────
    - matchers:
        - severity =~ "critical|warning"
      receiver: ai-enrichment
      group_wait: 30s
      continue: true

    # ── AWS alerts: separate channel ─────────────────────────────────────────
    # Muted on weekends — anything urgent already paged via the severity
    # routes above; this channel is for working-hours triage.
    - matchers:
        - alertname =~ "AWS.*|RDS.*|ALB.*|SQS.*"
      receiver: slack-aws
      group_wait: 1m
      repeat_interval: 2h
      mute_time_intervals:
        - weekends

    # ── Watchdog: silence the always-firing heartbeat alert ──────────────────
    - matchers:
        - alertname = "Watchdog"
      receiver: "null"

receivers:
  - name: "null"

  - name: slack-default
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'
        actions:
          - type: button
            text: Runbook
            url: '{{ (index .Alerts 0).Annotations.runbook }}'
          - type: button
            text: Dashboard
            url: '{{ (index .Alerts 0).Annotations.dashboard }}'

  - name: slack-slo
    slack_configs:
      - channel: "#slo-burn"
        send_resolved: true
        title: ':fire: SLO Burn Rate Alert'
        text: '{{ template "slack.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-aws
    slack_configs:
      - channel: "#aws-alerts"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-critical-key
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          namespace: '{{ .CommonLabels.namespace }}'
          pod: '{{ .CommonLabels.pod }}'
          node: '{{ .CommonLabels.node }}'
          runbook: '{{ .CommonAnnotations.runbook }}'

  - name: pagerduty-slo
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-slo-key
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        details:
          burn_window: '{{ .CommonLabels.window }}'
          service: '{{ .CommonLabels.job }}'

  # AI enrichment webhook — the enrichment-server enriches with Claude then posts to Slack
  - name: ai-enrichment
    webhook_configs:
      - url: http://enrichment-server.monitoring.svc.cluster.local:8080/webhook
        send_resolved: false    # Only send firing — enrichment is for active alerts
        max_alerts: 5           # Don't overwhelm Claude with large groups
        http_config:
          bearer_token_file: /etc/alertmanager/secrets/enrichment-server-token

inhibit_rules:
  # Suppress warning alerts when critical fires for the same service
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "namespace", "job"]

  # Suppress pod-level alerts when the node is down
  - source_matchers:
      - alertname = "KubernetesNodeNotReady"
    target_matchers:
      - alertname =~ "KubernetesPod.*"
    equal: ["node"]
