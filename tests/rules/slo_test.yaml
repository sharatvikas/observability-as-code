##
## promtool unit tests for SLO multi-burn-rate alerting rules.
## Validates fast-burn, slow-burn, and budget-low thresholds.
##
## Run: promtool test rules tests/rules/slo_test.yaml
##
## NOTE: SLO alerts depend on pre-computed ratio metrics. These tests
## inject the ratio metrics directly rather than the raw counters.
## This is the standard approach for testing multi-window SLO alerts
## because it decouples the recording rule computation from alert logic.
##
rule_files:
  - ../../alerts/slo.yaml

evaluation_interval: 1m

tests:
  ##
  ## SLOAvailabilityFastBurn — 99.9% SLO, burn rate > 14.4x
  ## Alert requires BOTH 1h and 5m windows to be elevated (double window)
  ##

  - name: SLOAvailabilityFastBurn fires when 1h and 5m windows both show fast burn
    interval: 1m
    input_series:
      # Burn rate 14.4x threshold = 14.4 * 0.001 = 0.0144
      # Use 0.02 (2% error rate) — well above threshold
      - series: 'job:request_error_rate:ratio_rate1h{job="payments-api"}'
        values: '0.02 0.02 0.02 0.02 0.02'
      - series: 'job:request_error_rate:ratio_rate5m{job="payments-api"}'
        values: '0.02 0.02 0.02 0.02 0.02'

    alert_rule_test:
      - eval_time: 1m
        alertname: SLOAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              job: payments-api
              severity: critical
              category: slo
              window: "1h"
            exp_annotations:
              summary: "payments-api SLO fast burn — page immediately"
              description: "payments-api 1h error rate is 2% — above the 14.4x fast-burn threshold (1.44%). At this rate, the monthly 99.9% SLO budget will be exhausted in under 2 hours.\n"
              runbook: "https://runbooks.internal/slo/fast-burn"
              dashboard: "https://grafana.internal/d/slo-overview?var-job=payments-api"

  - name: SLOAvailabilityFastBurn does not fire when only 1h window is elevated
    interval: 1m
    input_series:
      - series: 'job:request_error_rate:ratio_rate1h{job="checkout-api"}'
        values: '0.02 0.02 0.02 0.02 0.02'
      # 5m window is low — recent recovery, not a fast burn
      - series: 'job:request_error_rate:ratio_rate5m{job="checkout-api"}'
        values: '0.0005 0.0005 0.0005 0.0005 0.0005'

    alert_rule_test:
      - eval_time: 5m
        alertname: SLOAvailabilityFastBurn
        exp_alerts: []

  - name: SLOAvailabilityFastBurn does not fire for healthy service
    interval: 1m
    input_series:
      - series: 'job:request_error_rate:ratio_rate1h{job="auth-api"}'
        values: '0.0001 0.0001 0.0001 0.0001 0.0001'
      - series: 'job:request_error_rate:ratio_rate5m{job="auth-api"}'
        values: '0.0001 0.0001 0.0001 0.0001 0.0001'

    alert_rule_test:
      - eval_time: 5m
        alertname: SLOAvailabilityFastBurn
        exp_alerts: []

  ##
  ## SLOAvailabilitySlowBurn — burn rate > 6x over 6h + 30m
  ##

  - name: SLOAvailabilitySlowBurn fires when both 6h and 30m windows show elevated error rate
    interval: 1m
    input_series:
      # Slow burn threshold = 6 * 0.001 = 0.006
      # Use 0.008 — above the 6x threshold
      - series: 'job:request_error_rate:ratio_rate6h{job="payments-api"}'
        values: '0.008 0.008 0.008 0.008 0.008'
      - series: 'job:request_error_rate:ratio_rate30m{job="payments-api"}'
        values: '0.008 0.008 0.008 0.008 0.008'

    alert_rule_test:
      - eval_time: 1m
        alertname: SLOAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              job: payments-api
              severity: warning
              category: slo
              window: "6h"
            exp_annotations:
              summary: "payments-api SLO slow burn — investigate"
              description: "payments-api is burning error budget at a sustained elevated rate. Error budget will be exhausted in ~5 days at this rate.\n"
              runbook: "https://runbooks.internal/slo/slow-burn"
              dashboard: "https://grafana.internal/d/slo-overview?var-job=payments-api"

  - name: SLOAvailabilitySlowBurn does not fire when error rate is below threshold
    interval: 1m
    input_series:
      - series: 'job:request_error_rate:ratio_rate6h{job="checkout-api"}'
        values: '0.0005 0.0005 0.0005 0.0005 0.0005'
      - series: 'job:request_error_rate:ratio_rate30m{job="checkout-api"}'
        values: '0.0005 0.0005 0.0005 0.0005 0.0005'

    alert_rule_test:
      - eval_time: 5m
        alertname: SLOAvailabilitySlowBurn
        exp_alerts: []

  ##
  ## SLOAvailabilityBudgetLow — sustained 3d error rate above 1x (0.001)
  ##

  - name: SLOAvailabilityBudgetLow fires after 1h of sustained elevated 3d error rate
    interval: 1m
    input_series:
      # 0.002 = 2x the 99.9% SLO threshold (0.001), sustained for >1h
      - series: 'job:request_error_rate:ratio_rate3d{job="payments-api"}'
        values: '0.002+0x62'

    alert_rule_test:
      - eval_time: 61m
        alertname: SLOAvailabilityBudgetLow
        exp_alerts:
          - exp_labels:
              job: payments-api
              severity: info
              category: slo
              window: "3d"
            exp_annotations:
              summary: "payments-api SLO error budget will be exhausted this month"
              description: "payments-api 3-day error rate exceeds the 99.9% SLO threshold. Create a ticket to investigate and fix root causes before month end.\n"

  - name: SLOAvailabilityBudgetLow does not fire for healthy 3d error rate
    interval: 1m
    input_series:
      - series: 'job:request_error_rate:ratio_rate3d{job="auth-api"}'
        values: '0.0002+0x62'

    alert_rule_test:
      - eval_time: 61m
        alertname: SLOAvailabilityBudgetLow
        exp_alerts: []

  ##
  ## SLOLatencyFastBurn — 95% of requests < 200ms, burn rate > 14.4x
  ##

  - name: SLOLatencyFastBurn fires when both 1h and 5m windows show fast latency burn
    interval: 1m
    input_series:
      # Threshold = 14.4 * 0.05 = 0.72 (72% of requests above 200ms)
      - series: 'job:request_latency_above_slo:ratio_rate1h{job="payments-api"}'
        values: '0.80 0.80 0.80 0.80 0.80'
      - series: 'job:request_latency_above_slo:ratio_rate5m{job="payments-api"}'
        values: '0.80 0.80 0.80 0.80 0.80'

    alert_rule_test:
      - eval_time: 1m
        alertname: SLOLatencyFastBurn
        exp_alerts:
          - exp_labels:
              job: payments-api
              severity: critical
              category: slo
              window: "1h"
            exp_annotations:
              summary: "payments-api latency SLO fast burn"
              description: "payments-api is exceeding the 200ms latency threshold at 80% of requests — burning latency error budget fast.\n"
              runbook: "https://runbooks.internal/slo/latency-burn"

  - name: SLOLatencyFastBurn does not fire for acceptable latency distribution
    interval: 1m
    input_series:
      - series: 'job:request_latency_above_slo:ratio_rate1h{job="checkout-api"}'
        values: '0.02 0.02 0.02 0.02 0.02'
      - series: 'job:request_latency_above_slo:ratio_rate5m{job="checkout-api"}'
        values: '0.02 0.02 0.02 0.02 0.02'

    alert_rule_test:
      - eval_time: 5m
        alertname: SLOLatencyFastBurn
        exp_alerts: []

  ##
  ## SLOLatencySlowBurn — burn rate > 6x over 6h + 30m
  ##

  - name: SLOLatencySlowBurn fires when both 6h and 30m windows show elevated latency
    interval: 1m
    input_series:
      # Threshold = 6 * 0.05 = 0.30 (30% of requests above SLO threshold)
      - series: 'job:request_latency_above_slo:ratio_rate6h{job="payments-api"}'
        values: '0.40 0.40 0.40 0.40 0.40'
      - series: 'job:request_latency_above_slo:ratio_rate30m{job="payments-api"}'
        values: '0.40 0.40 0.40 0.40 0.40'

    alert_rule_test:
      - eval_time: 1m
        alertname: SLOLatencySlowBurn
        exp_alerts:
          - exp_labels:
              job: payments-api
              severity: warning
              category: slo
              window: "6h"
            exp_annotations:
              summary: "payments-api latency SLO slow burn"
              description: "payments-api is exceeding the 200ms latency SLO at a sustained rate. Investigate query performance, database, or downstream service latency.\n"
              runbook: "https://runbooks.internal/slo/latency-burn"

  - name: SLOLatencySlowBurn does not fire for healthy latency
    interval: 1m
    input_series:
      - series: 'job:request_latency_above_slo:ratio_rate6h{job="checkout-api"}'
        values: '0.01 0.01 0.01 0.01 0.01'
      - series: 'job:request_latency_above_slo:ratio_rate30m{job="checkout-api"}'
        values: '0.01 0.01 0.01 0.01 0.01'

    alert_rule_test:
      - eval_time: 5m
        alertname: SLOLatencySlowBurn
        exp_alerts: []
